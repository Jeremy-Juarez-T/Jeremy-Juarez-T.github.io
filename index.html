<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso Administrativo - Tlaxcala</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="image-section">
        <img
          src="img/tlax.png"
          alt="Tlaxcala - Una Nueva Historia"
          class="optimized-image"
        />
      </div>

      <div class="form-section">
        <div class="login-form">
          <h1 class="login-title">TLAXCALA</h1>
          <p class="login-subtitle">
            UNA NUEVA HISTORIA <span>2021 - 2027</span>
          </p>

          <form id="loginForm">
            <div class="input-group">
              <input type="email" id="email" placeholder=" " required />
              <label for="email">Correo electrónico</label>
              <i class="ri-mail-line"></i>
            </div>

            <div class="input-group">
              <input type="password" id="password" placeholder=" " required />
              <label for="password">Contraseña</label>
              <i class="ri-lock-fill"></i>
            </div>

            <button type="submit" class="neon-btn">Iniciar Sesión</button>
          </form>

          <div class="login-footer">
            <div class="wave"></div>
            <p>
              Sistema de acceso restringido. Contacte al administrador para
              credenciales.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
